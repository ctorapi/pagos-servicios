<svg width="720" height="180" viewBox="0 0 720 180" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="CopeNET">
  <defs>
    <linearGradient id="gGray" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E9E9EC"/>
      <stop offset="1" stop-color="#91949A"/>
    </linearGradient>
    <linearGradient id="gBlue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2B5DA8"/>
      <stop offset="1" stop-color="#78A9E8"/>
    </linearGradient>
    <filter id="glow" x="0" y="0" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <text x="20" y="108" font-size="108" font-family="Inter, Arial, sans-serif" font-weight="900" fill="url(#gGray)">Cope</text>
  <text x="325" y="108" font-size="108" font-family="Inter, Arial, sans-serif" font-style="italic" font-weight="900" fill="url(#gBlue)">NET</text>

  <ellipse cx="520" cy="120" rx="125" ry="11" fill="#29BDFF" opacity="0.85" filter="url(#glow)"/>
  <text x="245" y="145" font-size="30" font-family="Inter, Arial, sans-serif" fill="#F3F7FF">La red financiera del ecosistema cooperativo</text>
</svg>
